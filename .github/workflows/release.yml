# Build, test and publish a GitHub Release when a version tag is pushed.
# The tag must equal "v" + plugin.json "version" (tools/package.py checks it),
# and CHANGELOG.md must have a matching "## [x.y.z]" section.
name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write   # create the release and upload assets

defaults:
  run:
    shell: bash

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # MSVC x64 with the static CRT (see CMakeLists.txt): the exe depends on
      # system DLLs only.
      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build
        run: cmake --build build --config Release

      - name: Unit tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package
        run: python tools/package.py --tag "${GITHUB_REF_NAME}"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/*.wsplugin dist/*.wsplugin.sha256 \
            --title "${GITHUB_REF_NAME}" --notes-file dist/release-notes.md
